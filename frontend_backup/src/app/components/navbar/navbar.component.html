<header class="navbar">

  <div class="navbar-left">

    <button
      class="menu-button"
      (click)="toggleMenu()"
      aria-label="Open menu">

      <span class="menu-lines">
        <span></span>
        <span></span>
      </span>

      <span class="menu-label">MENU</span>

    </button>

  </div>


  <div class="navbar-center">

    <span class="status-dot"></span>

    <span class="status-text">
      ENGINEERING PORTFOLIO
    </span>

  </div>


  <div class="navbar-right">

    <div class="visitor-counter">

      <span class="eye">◉</span>

      <span>
        {{ visitors | number }}
      </span>

    </div>


    <button class="language-button">
      <span>FR</span>
    </button>


    <button
      class="theme-button"
      (click)="toggleTheme()">

      <span *ngIf="!themeService.isLightTheme()">☾</span>

      <span *ngIf="themeService.isLightTheme()">☀</span>

    </button>

  </div>

</header>


<div
  class="menu-backdrop"
  *ngIf="menuOpen"
  (click)="closeMenu()">
</div>


<aside
  class="side-menu"
  [class.open]="menuOpen">

  <div class="side-menu-header">

    <div>
      <span class="mini-label">NAVIGATION</span>

      <h2>JIHAN<span>.</span></h2>
    </div>

    <button
      class="close-button"
      (click)="closeMenu()">

      ×

    </button>

  </div>


  <nav class="navigation">

    <a routerLink="/" (click)="closeMenu()">
      <span>01</span>
      HOME
    </a>

    <a routerLink="/about" (click)="closeMenu()">
      <span>02</span>
      ABOUT
    </a>

    <a routerLink="/skills" (click)="closeMenu()">
      <span>03</span>
      SKILLS
    </a>

    <a routerLink="/experience" (click)="closeMenu()">
      <span>04</span>
      EXPERIENCE
    </a>

    <a routerLink="/projects" (click)="closeMenu()">
      <span>05</span>
      PROJECTS
    </a>

    <a routerLink="/activity" (click)="closeMenu()">
      <span>06</span>
      ACTIVITY
    </a>

    <a routerLink="/certifications" (click)="closeMenu()">
      <span>07</span>
      CERTIFICATIONS
    </a>

    <a routerLink="/infrastructure" (click)="closeMenu()">
      <span>08</span>
      INFRASTRUCTURE
    </a>

    <a routerLink="/contact" (click)="closeMenu()">
      <span>09</span>
      CONTACT
    </a>

  </nav>


  <div class="side-menu-footer">

    <div class="system-status">

      <span class="status-dot"></span>

      <div>
        <small>SYSTEM</small>
        <strong>ONLINE</strong>
      </div>

    </div>

    <p>
      CLOUD · DEVOPS · DEVSECOPS
    </p>

  </div>

</aside>
