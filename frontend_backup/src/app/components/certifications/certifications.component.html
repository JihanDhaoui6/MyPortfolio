<section class="section">

  <div class="section-header">

    <span class="section-number">07</span>

    <div>
      <span class="eyebrow">SYSTEMS</span>
      <h2>Infrastructure Lab</h2>
    </div>

  </div>


  <div class="lab-grid">

  <div *ngFor="let cert of certifications">
  <h3>{{ cert.name }}</h3>
  <p>{{ cert.organization }}</p>
  <span>{{ cert.category }}</span>
</div>

  </div>


  <div class="network-diagram">

    <div class="network-node">
      INTERNET
    </div>

    <span class="network-line"></span>

    <div class="network-node">
      NETWORK
    </div>

    <span class="network-line"></span>

    <div class="network-node">
      SERVER
    </div>

    <span class="network-line"></span>

    <div class="network-node orange">
      CONTAINERS
    </div>

  </div>

</section>
