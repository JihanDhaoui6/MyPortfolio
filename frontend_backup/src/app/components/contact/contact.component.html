<section class="section contact">

  <div class="contact-content">

    <span class="eyebrow">
      08 · GET IN TOUCH
    </span>

    <h2>
      Let's build
      <span>something.</span>
    </h2>

    <p>
      Have a project, an opportunity, or simply want
      to discuss cloud, DevOps or infrastructure?
    </p>

    <a
      class="email-button"
      [href]="'mailto:' + email">

      {{ email }}

      <span>↗</span>

    </a>


    <div class="social-links">

      <a
        href="https://github.com/"
        target="_blank">

        GitHub
      </a>

      <a
        href="https://www.linkedin.com/"
        target="_blank">

        LinkedIn
      </a>

      <a
        href="https://medium.com/"
        target="_blank">

        Medium
      </a>

    </div>

  </div>

</section>
