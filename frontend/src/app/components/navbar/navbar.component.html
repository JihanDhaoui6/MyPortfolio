<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">

    <!-- Logo + compteur de visites -->
    <div class="nav-left">
      <a class="logo" (click)="scrollTo('hero')">
        <span class="logo-dot"></span>
        <span class="logo-text">JD</span>
      </a>

      <div class="visit-counter" title="Nombre de visites">
        <span class="visit-icon">👁</span>
        <span class="visit-label">Views:</span>
        <span class="visit-value">{{ visits | number }}</span>
      </div>
    </div>

    <!-- Liens -->
    <ul class="nav-links" [class.open]="isMobileOpen">
      <li *ngFor="let link of links">
        <a
          (click)="scrollTo(link.id)"
          [class.active]="activeSection === link.id">
          {{ link.label }}
        </a>
      </li>
    </ul>

    <!-- Burger mobile -->
    <button class="burger" (click)="isMobileOpen = !isMobileOpen" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

  </div>
</nav>
