<section class="section">

  <div class="section-header">

    <span class="section-number">05</span>

    <div>
      <span class="eyebrow">ENGINEERING ACTIVITY</span>
      <h2>Activity</h2>
    </div>

  </div>


  <div class="activity-grid">

    <article
      class="activity-card"
      *ngFor="let activity of activities">

      <div class="activity-icon">
        {{ activity.icon }}
      </div>

      <div class="activity-platform">
        {{ activity.platform }}
      </div>

      <h3>
        {{ activity.title }}
      </h3>

      <p>
        {{ activity.description }}
      </p>

      <div class="activity-bottom">

        <span>
          {{ activity.time }}
        </span>

        <a
          [href]="activity.link"
          target="_blank"
          rel="noopener">

          OPEN ↗

        </a>

      </div>

    </article>

  </div>

</section>
