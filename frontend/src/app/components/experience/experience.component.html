<section id="experience">
  <div class="container">
    <h2 class="section-title">Experience</h2>
    <p class="section-subtitle">
      Mon parcours professionnel entre dev, cloud et sécurité.
    </p>

    <div class="timeline">
      <div
        *ngFor="let e of experiences; let i = index"
        class="timeline-item"
        [class.left]="i % 2 === 0"
        [class.right]="i % 2 !== 0">
        <div class="timeline-dot" [style.background]="e.color"></div>
        <div class="timeline-content card">
          <span class="timeline-period">{{ e.period }}</span>
          <h3>{{ e.role }}</h3>
          <p class="timeline-company">{{ e.company }}</p>
          <p class="timeline-desc">{{ e.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
