<section id="career">
  <div class="container">

    <!-- ===== HEADER ===== -->
    <div class="career-header">
      <div class="career-header-left">
        <span class="career-badge">📅 Timeline</span>
        <h2 class="career-title">Parcours professionnel</h2>
        <p class="career-subtitle">
          Étapes clés de ma formation et de mon expérience.
        </p>
      </div>
      <div class="career-rule"></div>
    </div>

    <!-- ===== CARTE PRINCIPALE ===== -->
    <div class="career-card">

      <!-- Marqueur NOW -->
      <div class="now-marker">
        <span class="now-pulse"></span>
        <span class="now-label">MAINTENANT</span>
        <span class="now-line"></span>
      </div>

      <!-- ===== Ligne TRAVAIL ===== -->
      <div class="career-row">
        <div class="row-label">
          <span class="row-icon">💼</span>
          <span class="row-text">Travail</span>
        </div>
        <div class="row-track">
          <div
            *ngFor="let e of workEntries"
            class="career-bar"
            [style.left.%]="e.left"
            [style.width.%]="e.width"
            [style.background]="e.color"
            [style.borderColor]="e.color"
            [attr.data-org]="e.organization"
            (mouseenter)="showTooltip(e)"
            (mouseleave)="hideTooltip()">
            <span class="bar-label">{{ e.organization }}</span>
          </div>
        </div>
      </div>

      <!-- ===== Ligne FORMATION ===== -->
      <div class="career-row">
        <div class="row-label">
          <span class="row-icon">🎓</span>
          <span class="row-text">Formation</span>
        </div>
        <div class="row-track">
          <div
            *ngFor="let e of studyEntries"
            class="career-bar"
            [style.left.%]="e.left"
            [style.width.%]="e.width"
            [style.background]="e.color"
            [style.borderColor]="e.color"
            [attr.data-org]="e.organization"
            (mouseenter)="showTooltip(e)"
            (mouseleave)="hideTooltip()">
            <span class="bar-label">{{ e.organization }}</span>
          </div>
        </div>
      </div>

      <!-- ===== Axe des années ===== -->
      <div class="career-years">
        <div class="row-label"></div>
        <div class="years-track">
          <span
            *ngFor="let y of years"
            class="year-label"
            [style.left.%]="yearPosition(y)">
            {{ y }}
          </span>
        </div>
      </div>

      <!-- ===== Grille verticale ===== -->
      <div class="career-verticals">
        <span *ngFor="let y of years" [style.left.%]="yearPosition(y)"></span>
      </div>

    </div>

    <!-- ===== Tooltip ===== -->
    <div
      class="career-tooltip"
      *ngIf="activeEntry as entry"
      [style.--accent]="entry.color">
      <div class="tooltip-header">
        <div class="tooltip-badge" [style.background]="entry.color">
          {{ entry.type === 'work' ? '💼' : '🎓' }}
        </div>
        <div class="tooltip-title-group">
          <h4>{{ entry.title }}</h4>
          <p class="tooltip-meta">
            <span>{{ entry.organization }}</span>
            <span class="tooltip-dot">·</span>
            <span>{{ entry.location }}</span>
          </p>
        </div>
      </div>
      <ul *ngIf="entry.description?.length" class="tooltip-list">
        <li *ngFor="let d of entry.description">{{ d }}</li>
      </ul>
    </div>

  </div>
</section>
