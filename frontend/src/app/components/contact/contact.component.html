<section id="contact">
  <div class="container">
    <h2 class="section-title">Contact</h2>
    <p class="section-subtitle">
      Une question, une opportunité, une idée ? Écris-moi.
    </p>

    <form class="contact-form card" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-field">
          <label for="name">Nom</label>
          <input id="name" type="text" formControlName="name" placeholder="Ton nom">
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="ton@email.com">
        </div>
      </div>

      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" rows="5" formControlName="message" placeholder="Ton message…"></textarea>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        Envoyer
      </button>

      <p *ngIf="submitted" class="form-success">
        ✓ Message envoyé. Merci !
      </p>
    </form>
  </div>
</section>
