<section id="hero" class="hero">
  <div class="container hero-grid">

    <!-- ===== GAUCHE : PHOTO + INFOS ===== -->
    <div class="hero-left">

      <!-- Photo au-dessus du texte -->
      <div class="hero-photo-wrapper">
        <div class="hero-photo-ring"></div>
        <div class="hero-photo-ring ring-2"></div>
        <img
          src="assets/profile.png"
          alt="Jihan Dhaoui"
          class="hero-photo">
      </div>

      <!-- Texte -->
      <div class="hero-intro">
        <p class="hero-greeting">Bonjour, je suis</p>

        <div class="hero-status">

            pour démarrer ma carrière
          </span>
        </div>
      </div>

      <!-- Tags -->
      <div class="hero-tags">
        <span>☁️ Cloud Native</span>
        <span>⚙️ DevOps &amp; CI/CD</span>
        <span>🛡️ DevSecOps</span>
        <span>📊 Observabilité</span>
        <span>📈 Scalabilité</span>
        <span>🤖 IA &amp; Automatisation</span>
      </div>

      <!-- Boutons -->
      <div class="hero-actions">
        <button class="btn btn-primary" (click)="scrollTo('contact')">
          Me contacter
        </button>
        <a class="btn btn-outline" href="assets/cv.pdf" download="Jihan-Dhaoui-CV.pdf">
          📄 Download CV
        </a>

    </div>

    <!-- ===== DROITE : TERMINAL ===== -->
    <div class="hero-right">
      <app-terminal></app-terminal>
    </div>
