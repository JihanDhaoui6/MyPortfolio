<section id="skills">
  <div class="container">
    <h2 class="section-title">Skills</h2>
    <p class="section-subtitle">
      Les technologies que j’utilise au quotidien pour construire, sécuriser
      et automatiser.
    </p>

    <div class="skills-grid">
      <div
        *ngFor="let cat of categories"
        class="skill-card card"
        [style.--card-accent]="cat.color">
        <div class="skill-header">
          <span class="skill-icon">{{ cat.icon }}</span>
          <h3>{{ cat.title }}</h3>
        </div>
        <ul class="skill-list">
          <li *ngFor="let item of cat.items">{{ item }}</li>
        </ul>
      </div>
    </div>
  </div>
</section>
