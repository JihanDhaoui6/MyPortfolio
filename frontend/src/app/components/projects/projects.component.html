<section id="projects">
  <div class="container">
    <h2 class="section-title">Projects</h2>
    <p class="section-subtitle">
      Une sélection de projets qui mélangent infra, code et automatisation.
    </p>

    <div class="projects-grid">
      <article
        *ngFor="let p of projects"
        class="project-card card"
        [style.--card-accent]="p.color">
        <h3>{{ p.title }}</h3>
        <p>{{ p.description }}</p>
        <ul class="project-tech">
          <li *ngFor="let t of p.tech">{{ t }}</li>
        </ul>
        <div class="project-links">
          <a *ngIf="p.github" [href]="p.github" target="_blank" class="btn btn-outline">
            GitHub
          </a>
          <a *ngIf="p.demo" [href]="p.demo" target="_blank" class="btn btn-primary">
            Demo
          </a>
        </div>
      </article>
    </div>
  </div>
</section>
