<section id="certifications">
  <div class="container">
    <h2 class="section-title">Certifications</h2>
    <p class="section-subtitle">
      Mes validations techniques et parcours de montée en compétence.
    </p>

    <div class="certs-grid">
      <a
        *ngFor="let c of certifications"
        [href]="c.url || '#'"
        target="_blank"
        class="cert-card card"
        [style.--card-accent]="c.color">
        <div class="cert-badge">🏅</div>
        <h3>{{ c.name }}</h3>
        <p class="cert-issuer">{{ c.issuer }}</p>
        <p class="cert-date">{{ c.date }}</p>
      </a>
    </div>
  </div>
</section>
