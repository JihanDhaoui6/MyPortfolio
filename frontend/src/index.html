<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Jihan Dhaoui — Cloud & DevOps Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de Jihan Dhaoui — Cloud, DevOps, DevSecOps & IA">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-particles" id="bg-particles"></div>

  <app-root></app-root>

  <script>
    (function generateParticles() {
      const container = document.getElementById('bg-particles');
      const colors = ['sakura', 'blue', 'sage', 'cream', 'pink'];
      const count = 45;

      for (let i = 0; i < count; i++) {
        const p = document.createElement('span');
        p.className = 'particle ' + colors[Math.floor(Math.random() * colors.length)];

        const size = Math.random() * 6 + 4;
        const left = Math.random() * 100;
        const delay = Math.random() * 18;
        const duration = Math.random() * 18 + 18;

        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = left + '%';
        p.style.bottom = '-10px';
        p.style.animationDelay = delay + 's';
        p.style.animationDuration = duration + 's';

        container.appendChild(p);
      }
    })();
  </script>
</body>
</html>
